<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Keep track of your monthly expenses</p>
        </header>
        
        <div class="summary">
            <div class="summary-card">
                <div class="card-title">Total Expenses</div>
                <div class="card-value total-expenses" id="total-expenses">₹0.00</div>
            </div>
            <div class="summary-card">
                <div class="card-title">Number of Expenses</div>
                <div class="card-value" id="expense-count">0</div>
            </div>
            <div class="summary-card">
                <div class="card-title">Average Expense</div>
                <div class="card-value" id="average-expense">₹0.00</div>
            </div>
        </div>
        
        <div class="two-column">
            <div class="expense-form-container">
                <div class="card">
                    <h2>Add New Expense</h2>
                    <form id="expense-form">
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" required placeholder="What did you spend on?">
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount (₹)</label>
                            <input type="number" id="amount" required min="0.01" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="">Select a category</option>
                                <option value="Food">Food</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Housing">Housing</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Education">Education</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <button type="submit">Add Expense</button>
                    </form>
                </div>
            </div>
            
            <div class="expenses-container">
                <div class="card">
                    <h2>My Expenses</h2>
                    <div class="filters">
                        <button class="filter-btn active" data-category="all">All</button>
                        <button class="filter-btn" data-category="Food">Food</button>
                        <button class="filter-btn" data-category="Transportation">Transportation</button>
                        <button class="filter-btn" data-category="Entertainment">Entertainment</button>
                        <button class="filter-btn" data-category="Housing">Housing</button>
                        <button class="filter-btn" data-category="Utilities">Utilities</button>
                        <button class="filter-btn" data-category="Shopping">Shopping</button>
                        <button class="filter-btn" data-category="Healthcare">Healthcare</button>
                        <button class="filter-btn" data-category="Education">Education</button>
                        <button class="filter-btn" data-category="Other">Other</button>
                    </div>
                    <div id="expenses-list-container">
                        <div class="empty-state" id="empty-state">
                            <p>No expenses added yet</p>
                        </div>
                        <ul class="expense-list" id="expense-list"></ul>
                    </div>
                </div>
                
                <div class="card chart-container" id="chart-container">
                    <!-- Chart will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
